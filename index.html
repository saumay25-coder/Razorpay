<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2457d6">
<meta name="description" content="Tarang Cloud: client intelligence, issue consolidation, task delegation and verified outcomes.">
<title>Tarang Cloud · Portfolio Intelligence V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
<script src="/lib/domain.js" defer></script>
<script src="/assets/store.js" defer></script>
<script src="/assets/app.js" defer></script>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand"><span class="brand-icon"><i data-lucide="cloud" aria-hidden="true"></i></span><div><div class="brand-name">Tarang Cloud</div><div class="brand-subtitle">Portfolio Intelligence <span class="version-tag">V2</span></div></div></div>
  <div class="topbar-actions"><span id="actor-label" class="small muted">Associate Manager</span><button type="button" id="connect-button" class="button">Connected sign-in</button><button type="button" id="export-button" class="button"><i data-lucide="download" aria-hidden="true"></i>Export workspace</button></div>
</div></header>
<main class="workspace">
  <div class="mode-banner"><strong id="mode-label">Local demonstration</strong><span id="mode-note">Saved in this browser. Role switching is simulated, not real delivery.</span><label class="role-label">Demo role<select id="role-switch" aria-label="Demonstration role"></select></label></div>
  <div id="connection-error" class="inline-notice hidden" role="alert"></div>
  <div class="page-heading"><div><h1 id="page-title">Monday Portfolio Overview</h1><p id="page-description" class="page-description">Loading the shared workspace…</p></div></div>
  <section id="kpi-strip" class="kpi-strip v2-kpis" aria-label="Portfolio summary"></section>
  <div id="portfolio-meta" class="portfolio-meta"></div>
  <nav class="navigation v2-navigation" role="tablist" aria-label="Workspace navigation">
    <div class="nav-item"><button class="nav-tab" data-view="overview" role="tab" aria-selected="true" id="tab-overview" aria-controls="view-content"><i data-lucide="layout-dashboard" aria-hidden="true"></i><span>Overview</span></button></div>
    <div class="nav-item"><button class="nav-tab" data-view="clients" role="tab" aria-selected="false" id="tab-clients" aria-controls="view-content" tabindex="-1"><i data-lucide="building-2" aria-hidden="true"></i><span>Clients</span></button></div>
    <div class="nav-item"><button class="nav-tab" data-view="intelligence" role="tab" aria-selected="false" id="tab-intelligence" aria-controls="view-content" tabindex="-1"><i data-lucide="sparkles" aria-hidden="true"></i><span>AI Intelligence</span></button></div>
    <div class="nav-item"><button class="nav-tab" data-view="tasks" role="tab" aria-selected="false" id="tab-tasks" aria-controls="view-content" tabindex="-1"><i data-lucide="list-checks" aria-hidden="true"></i><span>Tasks</span></button></div>
    <div class="nav-item"><button class="nav-tab" data-view="approval" role="tab" aria-selected="false" id="tab-approval" aria-controls="view-content" tabindex="-1"><i data-lucide="shield-check" aria-hidden="true"></i><span>Human Approval</span></button></div>
  </nav>
  <section id="view-content" role="tabpanel" aria-labelledby="tab-overview"><p class="muted">Loading saved records…</p></section>
  <footer class="footer-note"><span>Case 3 · Manual processing · No automatic Monday scheduling</span><button type="button" id="reset-button" class="link-button">Reset case demonstration (keeps a backup)</button></footer>
</main>
<dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" id="close-dialog" class="button" aria-label="Close details">Close</button></div><div id="detail-content"></div></dialog>
<div id="help-bubble" class="help-bubble hidden" role="tooltip"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
